  <!-- macOS Title Bar -->
  <path
    d="M10 26
       Q10 10 26 10
       H874
       Q890 10 890 26
       V62
       H10 Z"
    fill="#2d2d2d"
  />

  <!-- Traffic Lights -->
  <circle cx="34" cy="36" r="7" fill="#ff5f57"/>
  <circle cx="58" cy="36" r="7" fill="#febc2e"/>
  <circle cx="82" cy="36" r="7" fill="#28c840"/>

  <!-- Window Title -->
  <text
