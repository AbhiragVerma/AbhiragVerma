<svg width="900" height="430" viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14"
                    flood-color="#000000"
                    flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Terminal Window -->
  <rect
    x="10"
    y="10"
    width="880"
    height="410"
    rx="16"
    fill="#1e1e1e"
    stroke="#343434"
